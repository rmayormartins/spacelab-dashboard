name: coletar-satnogs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar-satnogs
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pacote de paises (opcional)
        continue-on-error: true
        run: pip install --quiet reverse_geocoder
      - name: Coletar quadros
        env:
          SATNOGS_DB_TOKEN: ${{ secrets.SATNOGS_DB_TOKEN }}
        run: python scripts/collect.py
      - name: Publicar data/
        run: |
          git config user.name "spacelab-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "sem novidades" && exit 0
          git commit -m "data: coleta SatNOGS $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
